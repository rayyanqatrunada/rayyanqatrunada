<svg width="800" height="120" viewBox="0 0 800 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Subtle grid pattern background -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#58a6ff" stroke-width="0.3" stroke-opacity="0.08"/>
    </pattern>
    <linearGradient id="fadeEdge" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="15%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="85%" stop-color="#0d1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="topLine" x1="0" y1="0" x2="800" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="30%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="120" fill="url(#grid)"/>
  <rect width="800" height="120" fill="url(#fadeEdge)"/>
  <line x1="0" y1="0" x2="800" y2="0" stroke="url(#topLine)" stroke-width="1"/>
  <line x1="0" y1="119" x2="800" y2="119" stroke="url(#topLine)" stroke-width="0.5"/>
  <!-- Center code comment -->
  <text x="400" y="50" text-anchor="middle" fill="#8b949e" font-family="'Courier New', monospace" font-size="11" font-weight="400" opacity="0.5">// projects that define the journey</text>
  <text x="400" y="80" text-anchor="middle" fill="#58a6ff" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="3">FEATURED PROJECTS</text>
</svg>
